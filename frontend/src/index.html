<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ember &amp; Oak</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Wood-fired kitchen and coffee bar — menu, table ordering and reservations.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var d = document.documentElement;
      var t = localStorage.getItem('rcms.theme'); if (t) d.dataset.theme = t;
      d.dataset.palette = localStorage.getItem('rcms.palette') || 'navy-pink';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
